<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      background: #ffe6e8;
      text-align: center;
      overflow-x: hidden;
    }
    .page {
      display: none;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .active {
      display: flex;
    }
    button {
      padding: 12px 24px;
      font-size: 18px;
      background-color: #ff4081;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      margin-top: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    button:hover {
      background-color: #e91e63;
    }

    /* Candle Styling */
    .candle-container {
      margin: 30px auto;
      cursor: pointer;
    }
    .flame {
      width: 20px;
      height: 30px;
      background: orange;
      border-radius: 50% 50% 20% 20%;
      margin: 0 auto;
      animation: flicker 0.5s infinite alternate;
      box-shadow: 0 0 15px orange;
    }
    .flame.off {
      display: none;
    }
    .candle-body {
      width: 30px;
      height: 100px;
      background: #fff;
      border-radius: 5px;
      margin: 0 auto;
      border: 2px solid #ccc;
    }
    @keyframes flicker {
      0% { transform: scale(1); opacity: 0.9; }
      100% { transform: scale(1.1); opacity: 1; }
    }

    /* Sunflower Styling */
    .sunflower {
      width: 120px;
      height: 120px;
      position: relative;
      margin: 20px auto;
      animation: spin 10s linear infinite;
    }
    .center-circle {
      width: 50px;
      height: 50px;
      background: #5c3a21;
      border-radius: 50%;
      position: absolute;
      top: 35px;
      left: 35px;
      z-index: 2;
    }
    .petal {
      width: 20px;
      height: 50px;
      background: #ffeb3b;
      border-radius: 50%;
      position: absolute;
      top: 10px;
      left: 50px;
      transform-origin: bottom center;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Photo Grid */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      max-width: 400px;
      margin: 20px auto;
    }
    .photo-card {
      width: 100%;
      height: 150px;
      background-color: #ffffff;
      border: 2px dashed #ff80ab;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <!-- Page 1: Candle Blow -->
  <div id="page1" class="page active">
    <h1>Blow the Candle! 🎂</h1>
    <div class="candle-container" onclick="blowOutCandle()">
      <div id="flame" class="flame"></div>
      <div class="candle-body"></div>
    </div>
    <p id="candle-text">Tap on the flame to blow it out!</p>
    <button onclick="nextPage(2)">Next Page ➔</button>
  </div>

  <!-- Page 2: Sunflower Animation -->
  <div id="page2" class="page">
    <h1>A Special Sunflower For You 🌻</h1>
    <div class="sunflower">
      <div class="center-circle"></div>
      <!-- Petals created via JavaScript -->
    </div>
    <p>You bring brightness everywhere!</p>
    <button onclick="nextPage(3)">See Memories ➔</button>
  </div>

  <!-- Page 3: 4 Photo Memory Placeholders -->
  <div id="page3" class="page">
    <h1>Our Best Memories 📸</h1>
    <div class="photo-grid">
      <div class="photo-card"><img src="photo1.jpg" alt="Memory 1" onerror="this.parentNode.innerHTML='Photo 1'"></div>
      <div class="photo-card"><img src="photo2.jpg" alt="Memory 2" onerror="this.parentNode.innerHTML='Photo 2'"></div>
      <div class="photo-card"><img src="photo3.jpg" alt="Memory 3" onerror="this.parentNode.innerHTML='Photo 3'"></div>
      <div class="photo-card"><img src="photo4.jpg" alt="Memory 4" onerror="this.parentNode.innerHTML='Photo 4'"></div>
    </div>
    <p>Replace photo1.jpg - photo4.jpg with your image files!</p>
    <button onclick="nextPage(1)">Restart 🔄</button>
  </div>

  <script>
    // Page Navigation Logic
    function nextPage(pageNumber) {
      document.querySelectorAll('.page').forEach(page => {
        page.classList.remove('active');
      });
      document.getElementById('page' + pageNumber).classList.add('active');
    }

    // Candle Blow Logic
    function blowOutCandle() {
      const flame = document.getElementById('flame');
      const text = document.getElementById('candle-text');
      flame.classList.add('off');
      text.innerText = "Wish came true! ✨ Click Next!";
    }

    // Generate Sunflower Petals
    const sunflower = document.querySelector('.sunflower');
    for (let i = 0; i < 12; i++) {
      const petal = document.createElement('div');
      petal.className = 'petal';
      petal.style.transform = `rotate(${i * 30}deg)`;
      sunflower.appendChild(petal);
    }
  </script>
</body>
</html>
